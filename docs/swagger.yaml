basePath: /
definitions:
  collection.CollectionResponse:
    properties:
      created_at:
        example: "2026-10-02T10:30:00Z"
        type: string
      id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      name:
        example: Wishlist
        type: string
      type:
        example: user
        type: string
      updated_at:
        example: "2026-10-02T10:30:00Z"
        type: string
    type: object
  collection.DeleteCollectionAPIResponse:
    properties:
      data:
        type: object
      message:
        example: collection deleted successfully
        type: string
    type: object
  collection.DeleteCollectionRequest:
    properties:
      saved_items_action:
        allOf:
        - $ref: '#/definitions/collection.SavedItemsAction'
        description: |-
          SavedItemsAction is what to do with the collection's saved items.

          "delete" removes them along with the collection. "move" files them into
          target_collection_id first, and then removes the collection. Both are
          required: the request must say which, because the two are not variants of a
          single outcome and one of them discards saved items.
        enum:
        - delete
        - move
        example: delete
      target_collection_id:
        description: |-
          TargetCollectionID is where the saved items go when SavedItemsAction is
          "move".

          It must be a collection id and must be null when SavedItemsAction is
          "delete". Unsorted is a valid target and is named here by its id, like any
          other collection; there is no separate mode or flag for it, and no fallback
          to it. A target that does not exist is an error rather than a substitution.
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
    type: object
  collection.PutSavedItemIntoCollectionAPIResponse:
    properties:
      data:
        $ref: '#/definitions/collection.PutSavedItemIntoCollectionResponse'
      message:
        example: saved item moved into collection successfully
        type: string
    type: object
  collection.PutSavedItemIntoCollectionRequest:
    properties:
      collection_name:
        description: |-
          CollectionName is the display name of the user collection to file the saved
          item under. The collection is created if it does not exist yet. Names are
          matched case-insensitively with surrounding whitespace ignored, and a name
          already used by a system collection is rejected.

          This field carries no `validate` constraint on purpose. The service owns
          collection name rules and answers with the INVALID_COLLECTION_NAME code, so
          a constraint here would pre-empt that and collapse both failure cases into a
          generic VALIDATION_ERROR.
        example: Wishlist
        type: string
    type: object
  collection.PutSavedItemIntoCollectionResponse:
    properties:
      already_in_collection:
        description: |-
          AlreadyInCollection is true when the saved item was already in the target
          collection, in which case nothing was written. It is mutually exclusive with
          CollectionCreated.
        example: false
        type: boolean
      collection:
        $ref: '#/definitions/collection.CollectionResponse'
      collection_created:
        description: |-
          CollectionCreated is true only when this call created the collection. It is
          false when an existing collection was reused.
        example: true
        type: boolean
      saved_item:
        $ref: '#/definitions/collection.PutSavedItemSavedItemResponse'
    type: object
  collection.PutSavedItemSavedItemResponse:
    properties:
      collection_id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      created_at:
        example: "2026-10-02T10:30:00Z"
        type: string
      domain:
        example: example.com
        type: string
      id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      platform:
        example: youtube
        type: string
      title:
        example: An interesting article
        type: string
      updated_at:
        example: "2026-10-02T10:30:00Z"
        type: string
      url:
        example: https://example.com/articles/1
        type: string
    type: object
  collection.SavedItemsAction:
    enum:
    - delete
    - move
    type: string
    x-enum-varnames:
    - SavedItemsActionDelete
    - SavedItemsActionMove
  enrichment.EnrichSavedItemAPIResponse:
