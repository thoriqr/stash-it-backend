  /saved-items/{id}/enrich:
    post:
      description: |-
        Fetches the page at the saved item's URL and stores the metadata it exposes, such as title, platform, description and preview image.
        This acts on exactly one saved item. It is not a batch operation and never touches other saved items.
        A page is not required to expose every field. Whatever is found is stored and the rest stay null, so an item with only a title is still enriched successfully.
        If the page cannot be fetched or read, the enrichment is recorded as failed and the saved item is returned unchanged. The saved item itself stays valid: a URL that could not be enriched is still a saved item.
        The saved item must belong to the authenticated user. A saved item that does not exist and one owned by another user both return the same not found response, so this endpoint never discloses whether an ID exists.
        Enrichment never changes which collection the item is in.
        This is the only endpoint that fetches a page inside the API process, so it is rate limited per authenticated user. The budget is spent before the request reaches this handler: a refused enrichment performs no fetch and writes no enrichment state.
        Possible error codes:
        - SAVED_ITEM_NOT_FOUND
        - BAD_REQUEST
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Saved item ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enrichment.EnrichSavedItemAPIResponse'
        "400":
          description: Invalid saved item ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Saved item not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Rate limit exceeded for this user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Rate limiting is unavailable, so the fetch is not attempted
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Enrich one saved item's metadata
      tags:
      - SavedItem
  /search:
    get:
      description: |-
        Search the current user's saved items and collections with one query.
        Saved items are matched on title, domain and url. Collections are matched on name, and system collections are included, so a search for "unsorted" can find the Unsorted collection.
        Matching prefers a substring match and falls back to fuzzy matching for typos, so "ca" finds "camera" and "camra" finds it too. A result that contains the query is always ranked above a result that only fuzzy-matches it. Recency is never a substitute for relevance: it only breaks ties between results that scored the same.
        Results are capped rather than paged. Saved items return up to the internal maximum and collections up to a small fixed number. This endpoint does not accept a limit, page or cursor parameter.
        A saved item result reports the collection it is filed in, with that collection's id and name, so where a result lives is shown without another request. It also reports the item's enrichment_status, which is what distinguishes a page that exposed no title from a page that has not been read yet. title, domain and image_url are reported as stored and are null until enrichment populates them; no value is ever derived from the URL in their place.
        A collection result reports only its id and name. Use the id with GET /collections/{id}/saved-items to see what is in it. Whether a collection is one of the user's own or a system collection is reported by GET /collections rather than here.
        Only the authenticated user's own saved items and collections are searched. Another user's matching data is never returned.
        A search that matches nothing is a successful request with empty collections and saved_items arrays, not a 404.
        The query must be at least 2 and at most 128 characters. Surrounding whitespace is trimmed.
        Possible error codes:
        - INVALID_SEARCH_QUERY
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Search query, at least 2 and at most 128 characters
        example: camera
        in: query
        maxLength: 128
        minLength: 2
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/search.SearchAPIResponse'
        "400":
          description: Search query is blank, shorter than 2 characters or longer
            than 128 characters
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Global Search
      tags:
      - Search
  /users/me:
    get:
      description: |-
        Returns the profile of the authenticated user, together with the authentication providers linked to it and whether the account holds a password credential.
        The user carries id, email, display_name, has_password_credential, created_at and identities. Nothing else about the account is reported: no password hash, no provider subject, no session identifier.
        Each identity carries provider, linked_at, email_snapshot and display_name_snapshot. provider_subject is never reported.
        The snapshots are what the provider asserted about the account at the moment the link was made, kept as history. They are not copies of the account's own email and display_name, they are not refreshed, and they may legitimately disagree with both — comparing them is the client's call. Nothing is fetched from the provider to update them.
        Both snapshots preserve the stored nullability. A provider that asserted no value reports JSON null, which is different from a provider that asserted an empty value and reports "". Neither is ever filled in from the account's current email or display name.
        provider is the value stored at link time and is not a value this API maintains a list of, so a client must render a provider it has not seen before rather than treating it as an error. The array is ordered oldest link first and is always present, as an empty array when nothing is linked.
        has_password_credential decides which form the password settings screen should offer. It is read from the database on every request. It is a rendering hint and never a decision: PUT /users/me/password determines the actual case from the same database and applies the rule that follows from it.
        This route carries no rate limit. Reading a profile spends two indexed reads and holds nothing beyond the request, so a budget here would buy no protection and would — because the limiter fails closed — make the application unable to render a profile during a Redis outage.
        Only the authenticated user's own profile is returned. There is no route that accepts a user id, so one user's profile cannot be read by naming another's.
        Possible error codes:
        - USER_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.GetUserAPIResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: The account this token names no longer exists
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's profile
      tags:
      - User
    patch:
      consumes:
      - application/json
      description: |-
        Renames the authenticated user. display_name is the only field this endpoint accepts; a body carrying any other field changes nothing.
        The name must be between 2 and 100 characters, which are the same bounds registration applies to the same column. It is not trimmed and not case-folded, so a value submitted with surrounding whitespace is stored with it — deliberately matching how registration stores a display name.
        Only the authenticated user's row is written. No other user is affected and no unique rule applies to display names, so this endpoint never answers with a conflict.
        The response is the complete profile, in the same shape GET /users/me returns, and is the row this request wrote rather than a re-read. A client therefore never has to merge two representations of the profile it is showing.
        Updating the display name carries no rate limit either, even though it writes. A rename spends one indexed UPDATE, arranges nothing downstream, and holds nothing beyond the request; DELETE /saved-items/:id and DELETE /collections/:id are unlimited for the same reason.
        Possible error codes:
        - VALIDATION_ERROR
        - BAD_REQUEST
        - USER_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UpdateUserAPIResponse'
        "400":
          description: Malformed body, or display_name absent, shorter than 2 or longer
            than 100 characters
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: The account this token names no longer exists
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Update the current user's display name
      tags:
      - User
  /users/me/password:
    put:
      consumes:
      - application/json
      description: |-
        Sets the authenticated user's password. Which of the two things it does is decided by the database, not by the request: an account holding no credential stores a first password, and one that already holds one has its password replaced. has_password_credential from GET /users/me tells a client which form to render, and is never consulted to decide what happens here.
        Send new_password alone when the account holds no credential, and both new_password and current_password when it does. Sending current_password for an account that has no credential is refused with UNEXPECTED_CURRENT_PASSWORD rather than ignored, because it would otherwise report success for a password that was never checked.
        An existing credential is only replaced once the submitted current_password has been verified against it. A wrong password answers 401 CURRENT_PASSWORD_INVALID and costs one Argon2id derivation: the new password is not derived at all when the current one fails.
        Creating a first password revokes nothing. Changing an existing one revokes every other active session of the account and preserves the session making the request. **That revocation does not take effect immediately for a session already holding an access token.** Access tokens in this application are stateless and are never checked against the session row, so a token issued before this request keeps working until its own expiry — up to about 15 minutes. Signing a device out here therefore means its refresh no longer works, not that its existing token stops working at once.
        Two concurrent requests that both create a password produce exactly one success; the other is refused with 409 PASSWORD_CREDENTIAL_ALREADY_EXISTS and its password is not stored over the winner's. Two concurrent requests that both change a password produce exactly one success; the other is refused with 409 PASSWORD_ALREADY_CHANGED rather than silently overwriting a password it never verified.
        If no Argon2id capacity is available the answer is 503 PASSWORD_WORK_UNAVAILABLE with a Retry-After, and nothing at all is written: no credential is stored and no session is revoked.
        The route is rate limited per authenticated user: 5 requests per 15 minutes. A request over budget is refused with 429 USER_RATE_LIMIT_EXCEEDED and a Retry-After, and never reaches the derivations it guards, so a refused request stores nothing and revokes nothing. The charge is not refunded on success or on failure — a failed attempt costs the budget, because verifying a submitted current_password is exactly what the budget bounds. The budget fails closed: if the counter cannot be evaluated the route answers 503 USER_RATE_LIMIT_UNAVAILABLE and writes nothing, while GET /users/me and PATCH /users/me are unaffected.
        Possible error codes:
        - VALIDATION_ERROR
        - BAD_REQUEST
        - CURRENT_PASSWORD_REQUIRED
        - UNEXPECTED_CURRENT_PASSWORD
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - CURRENT_PASSWORD_INVALID
        - PASSWORD_CREDENTIAL_NOT_FOUND
        - PASSWORD_CREDENTIAL_ALREADY_EXISTS
        - PASSWORD_ALREADY_CHANGED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - PASSWORD_WORK_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SetPasswordAPIResponse'
        "400":
          description: Malformed body, new_password absent, shorter than 8 or longer
            than 128 characters, or current_password sent for an account with no password
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token, or the submitted current_password
            does not match
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: A concurrent request created or changed this password first
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Too many password requests from this account
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: No password capacity is available, or the request could not
            be rate limited; nothing was written
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or change the current user's password
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: 'Enter your access token using the Bearer scheme. Example: "Bearer
      {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
