    properties:
      collections:
        items:
          $ref: '#/definitions/search.SearchCollectionResponse'
        type: array
      saved_items:
        items:
          $ref: '#/definitions/search.SearchSavedItemResponse'
        type: array
    type: object
  search.SearchSavedItemResponse:
    properties:
      collection_id:
        description: |-
          CollectionID is the collection the item is currently in. It is returned
          because the client needs it to show where a result lives, not because
          collection_id is searchable.
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      created_at:
        example: "2026-10-02T10:30:00Z"
        type: string
      domain:
        description: |-
          Domain and Title are null until background enrichment populates them, which
          is why they are pointers rather than strings.
        example: example.org
        type: string
      id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      title:
        example: Camera Buying Guide
        type: string
      updated_at:
        example: "2026-10-02T10:30:00Z"
        type: string
      url:
        example: https://example.org/notes/camera-buying-guide
        type: string
    type: object
  session.ListSessionsAPIResponse:
    properties:
      data:
        $ref: '#/definitions/session.ListSessionsResponse'
      message:
        example: sessions retrieved successfully
        type: string
      meta:
        $ref: '#/definitions/session.ListSessionsMeta'
    type: object
  session.ListSessionsMeta:
    properties:
      pagination:
        $ref: '#/definitions/session.ListSessionsPagination'
    type: object
  session.ListSessionsPagination:
    properties:
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 42
        type: integer
      total_pages:
        example: 3
        type: integer
    type: object
  session.ListSessionsResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/session.SessionResponse'
        type: array
    type: object
  session.LogoutAPIResponse:
    properties:
      data:
        type: object
      message:
        example: logout successful
        type: string
    type: object
  session.RefreshTokenAPIResponse:
    properties:
      data:
        $ref: '#/definitions/session.RefreshTokenResponse'
      message:
        example: token refreshed successfully
        type: string
    type: object
  session.RefreshTokenRequest:
    properties:
      refresh_token:
        example: v1.refresh-token-example
        maxLength: 512
        type: string
    required:
    - refresh_token
    type: object
  session.RefreshTokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiJ9...
        type: string
      refresh_token:
        example: v1.refresh-token-example
        type: string
    type: object
  session.RevokeSessionAPIResponse:
    properties:
      data:
        type: object
      message:
        example: session revoked successfully
        type: string
    type: object
  session.SessionResponse:
    properties:
      absolute_expires_at:
        example: "2026-10-08T10:30:00Z"
        type: string
      created_at:
        example: "2026-10-01T10:30:00Z"
        type: string
      device_name:
        example: Chrome on Windows
        type: string
      id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      installation_id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      is_current:
        example: true
        type: boolean
      last_activity_at:
        example: "2026-10-02T00:15:00Z"
        type: string
      platform:
        example: web
        type: string
      user_agent:
        example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        type: string
    type: object
  swagger.APIError:
    properties:
      code:
        example: ERROR_CODE
        type: string
      message:
        example: request failed
        type: string
    type: object
  swagger.APIErrorField:
    properties:
      field:
        example: field_name
        type: string
      message:
        example: invalid value
        type: string
    type: object
  swagger.APIErrorResponse:
    properties:
      error:
        $ref: '#/definitions/swagger.APIError'
    type: object
  swagger.ValidationError:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      fields:
        items:
          $ref: '#/definitions/swagger.APIErrorField'
        type: array
      message:
        example: validation failed
        type: string
    type: object
  swagger.ValidationErrorResponse:
    properties:
      error:
        $ref: '#/definitions/swagger.ValidationError'
    type: object
info:
  contact: {}
  description: REST API for Stash It.
  title: Stash It API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate a user using email and password and create a new session.
        Possible error codes:
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.LoginManualRequest'
      - description: Client platform
        in: header
        name: X-Platform
        type: string
      - description: Client installation ID (UUID)
        in: header
        name: X-Installation-ID
        type: string
      - description: Client device name
        in: header
        name: X-Device-Name
        type: string
      - description: Client user agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.LoginManualAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Login with email and password
      tags:
      - Login
  /auth/login/google:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate a user using a Google ID token.
        The response contains one of three outcomes:
        - authenticated: the user is authenticated and access/refresh tokens are returned.
        - account_link_required: the user must confirm linking the Google account.
        - registration_required: the user must continue the registration flow.
        Possible error codes:
        - VALIDATION_ERROR
        - INVALID_GOOGLE_TOKEN
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Google login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.LoginGoogleRequest'
      - description: Client platform
        in: header
        name: X-Platform
        type: string
      - description: Client installation ID (UUID)
        in: header
        name: X-Installation-ID
        type: string
      - description: Client device name
        in: header
        name: X-Device-Name
        type: string
      - description: Client user agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.LoginGoogleSuccessAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationError'
        "401":
          description: Invalid Google ID token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Login with Google
      tags:
      - Login
  /auth/login/google/account-link/{confirmation_id}:
    get:
      description: |-
        Retrieve an active Google account link confirmation.
        Possible error codes:
        - BAD_REQUEST
        - ACCOUNT_LINK_CONFIRMATION_INVALID
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Account link confirmation ID
        in: path
        name: confirmation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.GetAccountLinkConfirmationAPIResponse'
        "400":
          description: Invalid confirmation ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Account link confirmation is invalid
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Get account link confirmation
      tags:
      - Login
  /auth/login/google/account-link/{confirmation_id}/confirm:
    post:
      description: |-
        Confirm a Google account link and create an authenticated session.
        Possible error codes:
        - BAD_REQUEST
        - ACCOUNT_LINK_CONFIRMATION_INVALID
        - AUTH_IDENTITY_ALREADY_EXISTS
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Account link confirmation ID
        in: path
        name: confirmation_id
        required: true
        type: string
      - description: Client platform
        in: header
        name: X-Platform
        type: string
      - description: Client installation ID (UUID)
        in: header
        name: X-Installation-ID
        type: string
      - description: Client device name
        in: header
        name: X-Device-Name
        type: string
      - description: Client user agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.LoginGoogleSuccessAPIResponse'
        "400":
          description: Invalid confirmation ID or session metadata
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Account link confirmation is invalid or auth identity already
            exists
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Confirm Google account link
      tags:
      - Login
  /auth/logout:
    post:
      description: |-
        Log out the current session using a valid access token.
        Possible error codes:
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.LogoutAPIResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Session
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: |-
        Start a password reset flow using an email address.
        Possible error codes:
        - RESOURCE_NOT_FOUND
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/password_reset.RequestPasswordResetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_reset.RequestPasswordResetAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Request password reset
      tags:
      - Password Reset
  /auth/password-reset/continuation:
    get:
      description: |-
        Validate and retrieve the password reset continuation associated with the continuation token.
        Possible error codes:
        - PASSWORD_RESET_CONTINUATION_REQUIRED
        - PASSWORD_RESET_CONTINUATION_CONSUMED
        - PASSWORD_RESET_CONTINUATION_EXPIRED
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password reset continuation token
        in: header
        name: X-Password-Reset-Continuation
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_reset.GetPasswordResetContinuationAPIResponse'
        "401":
          description: Password reset continuation token is required
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Password reset continuation is invalid or expired
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Get password reset continuation
      tags:
      - Password Reset
  /auth/password-reset/finalize:
    post:
      consumes:
      - application/json
      description: |-
        Complete a password reset using a valid password reset continuation token.
        Possible error codes:
        - PASSWORD_RESET_CONTINUATION_REQUIRED
        - PASSWORD_RESET_CONTINUATION_CONSUMED
        - PASSWORD_RESET_CONTINUATION_EXPIRED
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password reset continuation token
        in: header
        name: X-Password-Reset-Continuation
        required: true
        type: string
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/password_reset.FinalizePasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_reset.FinalizePasswordResetAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Password reset continuation token is required
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Password reset continuation is invalid or expired
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Finalize password reset
      tags:
      - Password Reset
  /auth/password-reset/verification/{verification_id}:
    get:
      description: |-
        Get the current status of a password reset verification request.
        Possible error codes:
        - VERIFICATION_NOT_PENDING
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - RESOURCE_NOT_FOUND
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Verification ID
        in: path
        name: verification_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_reset.GetVerificationAPIResponse'
        "400":
          description: Invalid verification ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Verification not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Verification or password reset conflict
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Get password reset verification
      tags:
      - Password Reset
  /auth/password-reset/verification/{verification_id}/pin:
    post:
      description: |-
        Generate and send a verification PIN for a pending password reset.
        Possible error codes:
        - VERIFICATION_NOT_PENDING
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - RESOURCE_NOT_FOUND
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Verification ID
        in: path
        name: verification_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_reset.CreatePINAPIResponse'
        "400":
          description: Invalid verification ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Verification not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Verification or password reset conflict
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Create verification PIN
      tags:
      - Password Reset
  /auth/password-reset/verification/{verification_id}/resend:
    post:
      description: |-
        Generate and send a new verification PIN for a pending password reset.
        Possible error codes:
        - VERIFICATION_NOT_PENDING
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - VERIFICATION_RESEND_COOLDOWN
        - RESOURCE_NOT_FOUND
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Verification ID
        in: path
        name: verification_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_reset.ResendVerificationAPIResponse'
        "400":
          description: Invalid verification ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Verification not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Verification or password reset conflict
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Resend password reset verification PIN
      tags:
      - Password Reset
  /auth/password-reset/verification/{verification_id}/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verify a password reset using the verification PIN.
        Possible error codes:
        - VERIFICATION_NOT_PENDING
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - INVALID_VERIFICATION_CODE
        - VERIFICATION_CODE_ATTEMPTS_EXCEEDED
        - RESOURCE_NOT_FOUND
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Verification ID
        in: path
        name: verification_id
        required: true
        type: string
      - description: Password reset verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/password_reset.VerifyPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_reset.VerifyPasswordResetAPIResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Verification not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Verification conflict
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Verify password reset
      tags:
      - Password Reset
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Refresh an access token using a valid refresh token.
        Possible error codes:
        - REFRESH_TOKEN_INVALID
        - SESSION_REVOKED
        - SESSION_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/session.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.RefreshTokenAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Refresh token or session is invalid
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Refresh access token
      tags:
      - Session
  /auth/register/continuation:
    get:
      description: |-
        Validate and retrieve the registration continuation associated with the continuation token.
        Possible error codes:
        - REGISTRATION_CONTINUATION_REQUIRED
        - REGISTRATION_CONTINUATION_CONSUMED
        - REGISTRATION_CONTINUATION_EXPIRED
        - REGISTRATION_NOT_PENDING
        - REGISTRATION_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Registration continuation token
        in: header
        name: X-Registration-Continuation
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/registration.GetRegistrationContinuationAPIResponse'
        "401":
          description: Registration continuation token is required
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Registration continuation is invalid or expired
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Get registration continuation
      tags:
      - Registration
  /auth/register/finalize/manual:
    post:
      consumes:
      - application/json
      description: |-
        Complete a manual registration using a valid registration continuation token.
        Possible error codes:
        - REGISTRATION_CONTINUATION_CONSUMED
        - REGISTRATION_CONTINUATION_EXPIRED
        - REGISTRATION_NOT_PENDING
        - REGISTRATION_EXPIRED
        - INVALID_REGISTRATION_TYPE
        - USER_ALREADY_EXISTS
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Registration continuation token
        in: header
        name: X-Registration-Continuation
        required: true
        type: string
      - description: Finalize registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/registration.FinalizeManualRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/registration.FinalizeManualRegistrationAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Registration continuation token is required
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Registration cannot be finalized
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Finalize manual registration
      tags:
      - Registration
  /auth/register/finalize/social:
    post:
      consumes:
      - application/json
      description: |-
        Complete a social registration using a valid registration continuation token and create an authenticated session.
        Possible error codes:
        - REGISTRATION_CONTINUATION_CONSUMED
        - REGISTRATION_CONTINUATION_EXPIRED
        - REGISTRATION_NOT_PENDING
        - REGISTRATION_EXPIRED
        - INVALID_REGISTRATION_TYPE
        - USER_ALREADY_EXISTS
        - AUTH_IDENTITY_ALREADY_EXISTS
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Registration continuation token
        in: header
        name: X-Registration-Continuation
        required: true
        type: string
      - description: Client platform
        in: header
        name: X-Platform
        type: string
      - description: Client installation ID (UUID)
        in: header
        name: X-Installation-ID
        type: string
      - description: Client device name
        in: header
        name: X-Device-Name
        type: string
      - description: Client user agent
        in: header
        name: User-Agent
        type: string
      - description: Finalize social registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/registration.FinalizeSocialRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/registration.FinalizeSocialRegistrationAPIResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Registration continuation token is required
          schema:
