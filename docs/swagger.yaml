info:
  contact: {}
  description: REST API for Stash It.
  title: Stash It API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate a user using email and password and create a new session.
        Possible error codes:
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - LOGIN_RATE_LIMIT_EXCEEDED
        - LOGIN_RATE_LIMIT_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.LoginManualRequest'
      - description: Client platform
        in: header
        name: X-Platform
        type: string
      - description: Client installation ID (UUID)
        in: header
        name: X-Installation-ID
        type: string
      - description: Client device name
        in: header
        name: X-Device-Name
        type: string
      - description: Client user agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.LoginManualAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Too many attempts from this client address or for this email
            address; Retry-After reports when to try again
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Rate limiting is unavailable, so credentials were not checked
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Login with email and password
      tags:
      - Login
  /auth/login/google:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate a user using a Google ID token.
        The response contains one of three outcomes:
        - authenticated: the user is authenticated and access/refresh tokens are returned.
        - account_link_required: the user must confirm linking the Google account.
        - registration_required: the user must continue the registration flow.
        The Google authentication routes share one per-client-address budget.
        Possible error codes:
        - VALIDATION_ERROR
        - INVALID_GOOGLE_TOKEN
        - REGISTRATION_IDENTITY_MISMATCH
        - IP_RATE_LIMIT_EXCEEDED
        - IP_RATE_LIMIT_UNAVAILABLE
        - CLIENT_IP_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Google login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.LoginGoogleRequest'
      - description: Client platform
        in: header
        name: X-Platform
        type: string
      - description: Client installation ID (UUID)
        in: header
        name: X-Installation-ID
        type: string
      - description: Client device name
        in: header
        name: X-Device-Name
        type: string
      - description: Client user agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.LoginGoogleSuccessAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationError'
        "401":
          description: Invalid Google ID token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: A registration for this email is already in progress under
            a different account
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Too many requests from this client address; Retry-After reports
            when to try again
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Request limiting is unavailable, so the ID token was never
            verified
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Login with Google
      tags:
      - Login
  /auth/login/google/account-link/{confirmation_id}:
    get:
      description: |-
        Retrieve an active Google account link confirmation.
        The account email is returned masked, as masked_user_email.
        display_name_snapshot is the Google profile name captured when the confirmation was created.
        Shares the per-client-address budget with the other Google authentication routes.
        Possible error codes:
        - BAD_REQUEST
        - ACCOUNT_LINK_CONFIRMATION_INVALID
        - IP_RATE_LIMIT_EXCEEDED
        - IP_RATE_LIMIT_UNAVAILABLE
        - CLIENT_IP_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Account link confirmation ID
        in: path
        name: confirmation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.GetAccountLinkConfirmationAPIResponse'
        "400":
          description: Invalid confirmation ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Account link confirmation is invalid
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Too many requests from this client address; Retry-After reports
            when to try again
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Request limiting is unavailable, so the confirmation was never
            read
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Get account link confirmation
      tags:
      - Login
  /auth/login/google/account-link/{confirmation_id}/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Confirm a Google account link and create an authenticated session.
        The confirmation_id identifies the pending confirmation; it does not authorize it.
        The id_token is required and must belong to the same Google identity the confirmation was created for,
        matched on provider and provider subject. Email is never used to match.
        A mismatched or invalid token leaves the confirmation active, so the correct identity can still complete it.
        Shares the per-client-address budget with the other Google authentication routes.
        Possible error codes:
        - BAD_REQUEST
        - ACCOUNT_LINK_CONFIRMATION_INVALID
        - ACCOUNT_LINK_IDENTITY_MISMATCH
        - AUTH_IDENTITY_ALREADY_EXISTS
        - INVALID_GOOGLE_TOKEN
        - IP_RATE_LIMIT_EXCEEDED
        - IP_RATE_LIMIT_UNAVAILABLE
        - CLIENT_IP_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Account link confirmation ID
        in: path
        name: confirmation_id
        required: true
        type: string
      - description: Google ID token proving control of the identity being linked
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.ConfirmAccountLinkRequest'
      - description: Client platform
        in: header
        name: X-Platform
        type: string
      - description: Client installation ID (UUID)
        in: header
        name: X-Installation-ID
        type: string
      - description: Client device name
        in: header
        name: X-Device-Name
        type: string
      - description: Client user agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.LoginGoogleSuccessAPIResponse'
        "400":
          description: Invalid confirmation ID, missing id_token or invalid session
            metadata
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired Google ID token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Confirmation invalid, already used, or the token belongs to
            a different Google identity
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Too many requests from this client address; Retry-After reports
            when to try again
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Request limiting is unavailable, or the account was linked
            but the session could not be created; retry Google login
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Confirm Google account link
      tags:
      - Login
  /auth/logout:
    post:
      description: |-
        Log out the current session using a valid access token.
        Possible error codes:
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.LogoutAPIResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Session
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: |-
        Start a password reset flow using an email address.
        The response is the same whether or not the address belongs to an
        account: an unknown address is answered with a placeholder
        verification id that resolves to nothing, so this response cannot
        be used to discover which addresses are registered.
        Possible error codes:
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/password_reset.RequestPasswordResetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/password_reset.RequestPasswordResetAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Request password reset
      tags:
      - Password Reset
  /auth/password-reset/continuation:
    get:
      description: |-
        Validate and retrieve the password reset continuation associated with the continuation token.
        Possible error codes:
        - PASSWORD_RESET_CONTINUATION_REQUIRED
        - PASSWORD_RESET_CONTINUATION_CONSUMED
        - PASSWORD_RESET_CONTINUATION_EXPIRED
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password reset continuation token
        in: header
        name: X-Password-Reset-Continuation
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_reset.GetPasswordResetContinuationAPIResponse'
        "401":
          description: Password reset continuation token is required
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Password reset continuation is invalid or expired
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Get password reset continuation
      tags:
      - Password Reset
  /auth/password-reset/finalize:
    post:
      consumes:
      - application/json
      description: |-
        Complete a password reset using a valid password reset continuation token.
        This route performs the one Argon2id derivation in the flow and is
        therefore budgeted per client address separately from every other
        route here.
        Possible error codes:
        - PASSWORD_RESET_CONTINUATION_REQUIRED
        - PASSWORD_RESET_CONTINUATION_CONSUMED
        - PASSWORD_RESET_CONTINUATION_EXPIRED
        - PASSWORD_RESET_NOT_PENDING
        - PASSWORD_RESET_EXPIRED
        - PASSWORD_WORK_UNAVAILABLE
        - IP_RATE_LIMIT_EXCEEDED
        - IP_RATE_LIMIT_UNAVAILABLE
        - CLIENT_IP_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password reset continuation token
        in: header
        name: X-Password-Reset-Continuation
        required: true
        type: string
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/password_reset.FinalizePasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/password_reset.FinalizePasswordResetAPIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Password reset continuation token is required
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Password reset continuation is invalid or expired
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Too many requests from this client address; Retry-After reports
            when to try again
