        title, description, image_url, domain, platform and last_enriched_at are nullable and are reported as null rather than omitted. enrichment_status is pending, completed or failed and describes whether the enrichment process ran rather than whether every field is populated, so a completed item whose page exposed no title is reported completed with a null title. last_enriched_at is null until an enrichment has succeeded at least once, so a pending or failed item reports null.
        An item whose enrichment has not run, or failed, is still returned in full. It exists and belongs to the caller, and "this page has not been read yet" is a fact about an item rather than a reason to withhold it.
        This is a read. It starts no enrichment, changes nothing, and does not move the item between collections. The collection is read in the same statement as the item, so naming it costs no additional query.
