  /saved-items:
    get:
      description: |-
        Get the current user's recent saved items, newest first, one page at a time. This is the recent history: every saved item the user owns, across every collection they own.
        An item appears here wherever it has been filed. It stays in the history after it is moved into a collection of the user's own or created for it automatically, and each item reports which collection that is. Unsorted is not this listing's subject: it is one collection among the ones an item can be in, and it keeps its own place in GET /collections.
        Nothing is filtered out. An item whose enrichment has not run, one whose page could not be read, and one that has been filed into a collection are all ordinary states and all listed. There is no filter on enrichment_status and no branch on whether automatic organization ran; each item reports its own enrichment_status, so a client can tell pending, completed and failed apart without any of them being withheld.
        The response body is {"data": {...}, "message": "...", "meta": {...}}. data holds the page: {"saved_items": [...]}. Each item carries its full representation: id, url, domain, platform, title, description, image_url, collection_id, enrichment_status, last_enriched_at, created_at and updated_at, plus a collection object of {"id": "...", "name": "..."}.
        The collection object is inside each item because this listing spans collections. There is no single collection for the response to name, so each row names the one it is in, and the listing reads it in the same statement as the item so a client never needs a second request per row to learn where something lives. collection_id always equals collection.id. Only id and name are reported: type and system_key belong to GET /collections.
        title, description, image_url, domain, platform and last_enriched_at are nullable and are reported as null on a key that is always present. enrichment_status is pending, completed or failed and describes whether the enrichment process ran rather than whether every field is populated, so an item whose page exposed no title is reported completed with a null title. last_enriched_at is null until an enrichment has succeeded at least once.
        saved_items is an empty array rather than null when the user has saved nothing.
        This listing never starts enrichment, never organizes anything, and never writes. Enrichment is scheduled by saving a URL and by POST /saved-items/{id}/enrich; reading the history is not a reason to fetch anything.
        Ordering is fixed at created_at DESC, id DESC. There is no sort parameter: a history is read newest first or not at all. The id breaks ties, because created_at is constant within a transaction and rows inserted together genuinely share a timestamp.
        limit defaults to 20 and is capped at 50. A limit of 51 or more, or one below 1, is rejected as VALIDATION_ERROR; a non-numeric limit is BAD_REQUEST. limit=0 is treated as absent and falls back to the default.
        Pages are returned by cursor. Pass meta.cursor.next_cursor from one response as the cursor of the next request to continue where that page ended; omit it to start from the newest item. A cursor records a position rather than an item, so it keeps working even if the item it came from has since been deleted, and a cursor past the end returns an empty page rather than an error.
        meta.cursor.next_cursor is explicitly null on the final page, where meta.cursor.has_more is false. A cursor that cannot be decoded, carries an unsupported version, has no position, or holds a value that is not a timestamp is rejected as INVALID_CURSOR before any listing query runs. There is deliberately no total count: a cursor-paginated response does not know how many items exist overall, and this response reports no meta.pagination.
        Only the authenticated user's saved items are ever returned. No other user's item is reachable from this endpoint.
        This route is not rate limited, for the same reason GET /saved-items/{id} and DELETE /saved-items/{id} are not: it performs one indexed read, holds nothing beyond the request, and spends no shared resource. The two saved item routes that do cost something are limited, because a save arranges unbounded downstream work and an on-demand enrichment performs an outbound fetch.
        Possible error codes:
        - BAD_REQUEST (unparsable limit or cursor length)
        - INVALID_CURSOR
        - VALIDATION_ERROR (limit outside 1..50)
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - default: 20
        description: Number of saved items per page. Defaults to 20, capped at 50.
        example: 20
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor from meta.cursor.next_cursor of the previous page.
          Omit to start at the newest item.
        example: eyJ2IjoxLCJ2YWwiOiIyMDI2LTEwLTAyVDEwOjMwOjAwWiJ9
        in: query
        maxLength: 512
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: A page of recent saved items, with meta.cursor.next_cursor
            null when there is no next page
          schema:
            $ref: '#/definitions/saved_item.ListSavedItemsAPIResponse'
        "400":
          description: Invalid limit or cursor
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: List recent saved items
      tags:
      - SavedItem
    post:
      consumes:
      - application/json
      description: |-
        Save a URL to the current user's inbox. The domain is derived server-side from the submitted URL by lowercasing the host and removing a single leading "www."; the remote page is never fetched and no metadata extraction is performed. Platform and title are left null and are populated later by background enrichment.
        The response is deliberately minimal: data.saved_item carries only id, url, collection_id and enrichment_status. A save commits before enrichment has run, so at this point the only metadata column with a value is domain, which was derived locally rather than read off the page. Reporting title, platform, description, image_url or last_enriched_at here would be a set of nulls presented as though they had been looked up, which reads as "this page has nothing" rather than "this page has not been read yet".
        enrichment_status is the value the row was stored with, which on a fresh save is always "pending". Background enrichment is queued by the time this returns but has not run, so this endpoint never reports "completed". Read GET /saved-items/{id} for the complete item once enrichment has had a chance to finish.
        The save itself is unchanged: a single INSERT that commits before enrichment is queued, and no response field here is obtained by an extra query.
        Saving is rate limited per authenticated user. The budget is spent before the request reaches this handler, so a refused save creates nothing and queues nothing: there is no partial state to reconcile.
        Possible error codes:
        - VALIDATION_ERROR
        - INVALID_URL
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Save URL request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/saved_item.CreateSavedItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The saved item's id, url, collection_id and enrichment_status
          schema:
            $ref: '#/definitions/saved_item.CreateSavedItemAPIResponse'
        "400":
          description: Validation error or invalid URL
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Rate limit exceeded for this user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Rate limiting is unavailable, so the save is refused
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Save a URL
      tags:
      - SavedItem
