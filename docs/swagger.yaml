  /collections/{id}/saved-items:
    get:
      description: |-
        Get one of the current user's collections, newest saved item first. Unsorted behaves exactly like any other collection here; nothing about it is special-cased in this listing.
        The response body is {"data": {...}, "message": "...", "meta": {...}}. data holds the collection and the page: {"collection": {"id": "...", "name": "..."}, "saved_items": [...]}. The collection object carries only id and name, because the caller already arrived knowing the id and what it cannot know from the path is what the collection is called. It is reported on every response, including when saved_items is empty, so an empty collection is never mistaken for no match.
        Each saved item carries its full representation: id, url, domain, platform, title, description, image_url, collection_id, enrichment_status, last_enriched_at, created_at and updated_at. title, description, image_url, domain, platform and last_enriched_at are nullable. Every item keeps its own collection_id, which is always the id in data.collection.
        enrichment_status is pending, completed or failed, and describes whether the enrichment process ran rather than whether every field is populated, so an item whose page exposed no title is reported completed with a null title. last_enriched_at is null until an enrichment has succeeded at least once, so a pending or failed item reports null.
        Items whose title is still null and items whose enrichment failed are both returned. A null field is an ordinary state of an item, not a reason to omit it.
        saved_items is an empty array rather than null when the collection holds nothing.
        This listing never starts enrichment and never changes anything. Enrichment is scheduled by saving a URL and by an explicit request for one item; looking at a collection is not a reason to fetch anything.
        Ordering is fixed at created_at DESC, id DESC. There is no sort parameter: a collection is something a person curated, so the order they chose when filing is the one they see. The id breaks ties, because created_at is constant within a transaction and rows inserted together genuinely share a timestamp.
        limit defaults to 20 and is capped at 50. A limit of 51 or more, or one below 1, is rejected as VALIDATION_ERROR; a non-numeric limit is BAD_REQUEST. limit=0 is treated as absent and falls back to the default.
        Pages are returned by cursor. Pass meta.cursor.next_cursor from one response as the cursor of the next request to continue where that page ended; omit it to start from the beginning. A cursor records a position rather than an item, so it keeps working even if the item it came from has since been deleted, and a cursor past the end returns an empty page rather than an error.
        meta.cursor.next_cursor is explicitly null on the final page, where meta.cursor.has_more is false. A cursor that cannot be decoded, carries an unsupported version, has no position, or holds a value that is not a timestamp is rejected as INVALID_CURSOR. There is deliberately no total count: a cursor-paginated response does not know how many items exist overall, and this response reports no meta.pagination.
        The collection must belong to the authenticated user. A collection that does not exist and one owned by another user both return the same not found response, so this endpoint never discloses whether an ID exists.
        A collection that does not exist at all, rather than existing and being emptied, returns 404 COLLECTION_NOT_FOUND.
        Possible error codes:
        - BAD_REQUEST (unparsable limit or cursor length, or a non-UUID collection id)
        - INVALID_CURSOR
        - VALIDATION_ERROR (limit outside 1..50)
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - COLLECTION_NOT_FOUND
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Collection ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Number of saved items per page. Defaults to 20, capped at 50.
        example: 20
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor from meta.cursor.next_cursor of the previous page.
          Omit to start at the newest item.
        example: eyJ2IjoxLCJ2YWwiOiIyMDI2LTEwLTAyVDEwOjMwOjAwWiJ9
        in: query
        maxLength: 512
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: A page of the collection's saved items, with meta.cursor.next_cursor
            null when there is no next page
          schema:
            $ref: '#/definitions/collection.ListSavedItemsInCollectionAPIResponse'
        "400":
          description: Invalid limit, cursor or collection id
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Collection not found, or owned by another user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: List a collection's saved items
      tags:
      - Collection
  /saved-items:
    post:
      consumes:
      - application/json
      description: |-
        Save a URL to the current user's inbox. The domain is derived server-side from the submitted URL by lowercasing the host and removing a single leading "www."; the remote page is never fetched and no metadata extraction is performed. Platform and title are left null and are populated later by background enrichment.
        The response is deliberately minimal: data.saved_item carries only id, url, collection_id and enrichment_status. A save commits before enrichment has run, so at this point the only metadata column with a value is domain, which was derived locally rather than read off the page. Reporting title, platform, description, image_url or last_enriched_at here would be a set of nulls presented as though they had been looked up, which reads as "this page has nothing" rather than "this page has not been read yet".
        enrichment_status is the value the row was stored with, which on a fresh save is always "pending". Background enrichment is queued by the time this returns but has not run, so this endpoint never reports "completed". Read GET /saved-items/{id} for the complete item once enrichment has had a chance to finish.
        The save itself is unchanged: a single INSERT that commits before enrichment is queued, and no response field here is obtained by an extra query.
