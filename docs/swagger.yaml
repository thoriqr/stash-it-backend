  enrichment.SavedItemResponse:
    properties:
      collection_id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      created_at:
        example: "2026-10-02T10:30:00Z"
        type: string
      description:
        example: A short summary of the page
        type: string
      domain:
        example: example.com
        type: string
      enrichment_status:
        description: |-
          EnrichmentStatus is pending, completed or failed. It is completed when the
          enrichment process succeeded, which is not the same as every metadata field
          being present.
        example: completed
        type: string
      id:
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        type: string
      image_url:
        example: https://example.com/og.png
        type: string
      last_enriched_at:
        description: |-
          LastEnrichedAt is null until an enrichment has succeeded at least once. A
          failed attempt does not set it, because nothing was refreshed.
        example: "2026-10-02T10:31:00Z"
        type: string
      platform:
        example: youtube
        type: string
      price_amount:
        description: |-
          PriceAmount and PriceCurrency are the optional product price stored by the
          latest successful enrichment. price_amount is a JSON string so a client never
          has to parse money through a floating point value; price_currency is null when
          the source currency could not be normalized. Both are null when the page
          exposed no usable price or when there was no title to anchor it to.
        example: "24500000"
        type: string
      price_currency:
        example: IDR
        type: string
      title:
        example: An interesting article
        type: string
      updated_at:
        example: "2026-10-02T10:31:00Z"
        type: string
      url:
        example: https://example.com/articles/1
        type: string
    type: object
