    get:
      description: |-
        Get one of the current user's saved items by ID, with the collection it is filed in. A saved item that does not exist and one owned by another user both return the same not found response, so this endpoint never discloses whether an ID exists.
        The response body is {"data": {...}, "message": "..."}, where data holds the item and its collection: {"saved_item": {...}, "collection": {"id": "...", "name": "..."}}. The collection object carries only id and name; type and system_key belong to GET /collections.
