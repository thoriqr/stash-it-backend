    post:
      consumes:
      - application/json
      description: |-
        Start a manual registration flow using an email address.
        `verification_status` reports the state of the returned verification id.
        `pending` means a PIN must be requested. `verified` means PIN verification has
        already completed and a usable registration continuation exists: do not request another PIN.
        Possible error codes:
        - VALIDATION_ERROR
        - REGISTRATION_ALREADY_COMPLETED
        - REGISTRATION_ALREADY_EXISTS
