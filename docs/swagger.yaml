  /collections:
    get:
      description: |-
        Get the authenticated user's collections, one page at a time.
        The Unsorted collection is always the first result, under every sort, and never appears again on a later page. It is reported by its system_key, which is "unsorted"; the display name is not its identity and a collection's type never decides anything about it.
        Collections automatic organization created appear here exactly like collections the user named themselves, because a collection belongs to one user either way.
        sort selects the order and defaults to "newest". "newest" and "oldest" order by when the collection was created; "name" orders alphabetically, comparing names case-insensitively and ignoring surrounding whitespace, which is the same comparison collection names are stored under. Every order is broken by id so collections created in the same instant keep a stable order.
        Every collection reports what it holds through two fields. saved_items_count is how many saved items the collection contains, and saved_items_count_overflow says whether that number is the real one. Together they cover the whole range: a count from 0 to 99 with saved_items_count_overflow false is exact, and a count of 99 with saved_items_count_overflow true means "99 or more". A client can therefore render an exact number up to 99 and a "99+" above it without comparing against a threshold of its own. A collection holding nothing reports 0 and false, never null.
        The count is of the whole collection and is identical on every page of the listing, so a value shown beside a collection does not change as the user pages through the list. Items belonging to another user are never counted. The count is computed in the same statement that returns the page, so it costs no additional query.
        Pages are returned by cursor. Pass meta.cursor.next_cursor from one response as the cursor of the next request to continue where that page ended; omit it to start from the beginning. A cursor records a position rather than a row, so it keeps working even if the collection it came from has since been deleted or renamed, and a cursor pointing past the end returns an empty page rather than an error.
        meta.cursor.next_cursor is explicitly null on the final page, where meta.cursor.has_more is false. A cursor that cannot be decoded, carries an unsupported version, or does not match the requested sort is rejected as INVALID_CURSOR. There is deliberately no total count: a cursor-paginated response does not know how many collections exist overall, and this response reports no meta.pagination. That is about the size of the page, not about the size of a collection.
        Search is not available here. GET /search already searches collections by name.
        Possible error codes:
        - INVALID_COLLECTION_SORT
        - INVALID_CURSOR
        - VALIDATION_ERROR (limit outside 1..50)
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - default: newest
        description: Collection order
        enum:
        - newest
        - oldest
        - name
        example: newest
        in: query
        name: sort
        type: string
      - default: 20
        description: Number of collections per page. Defaults to 20, capped at 50.
        example: 20
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor from meta.cursor.next_cursor of the previous page.
          Omit to start at the beginning.
        example: eyJ2IjoxLCJzIjoibmV3ZXN0In0
        in: query
        maxLength: 512
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page of collections, with meta.cursor.next_cursor null
            when there is no next page
          schema:
            $ref: '#/definitions/collection.ListCollectionsAPIResponse'
        "400":
          description: Invalid sort, limit or cursor
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: List collections
      tags:
      - Collection
