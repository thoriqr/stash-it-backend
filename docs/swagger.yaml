  /client-releases/latest:
    get:
      description: |-
        Reports whether the calling client should update.
        status is none, optional or required and is computed by the server from the client's build, the platform's minimum supported build and the latest release. Clients must not compare version strings.
        When the platform has no release yet, status is none and latest and min_supported are null.
        Latest.build may be lower than current_build when the client is ahead of the published release; status is none in that case and means no action.
        Possible error codes:
        - INVALID_PLATFORM
        - INVALID_CLIENT_BUILD
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Client platform
        enum:
        - android
        - windows
        example: android
        in: query
        name: platform
        required: true
        type: string
      - description: Client build number (Android versionCode)
        example: 4
        in: query
        minimum: 1
        name: build
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client_release.CheckAPIResponse'
        "400":
          description: Invalid platform or build
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Check for a client release
      tags:
      - Client Release
  /collections:
    get:
      description: |-
        Retrieve the authenticated user's collections using cursor-based pagination.
        The Unsorted collection is always returned first, regardless of sort order, and is identified by its system_key ("unsorted").
        Collections can be sorted by creation time (newest or oldest) or alphabetically by name. The default sort is "newest".
        saved_items_count represents the number of saved items in a collection. Counts are exact up to 99; when saved_items_count_overflow is true, the count represents 99 or more.
        Pass meta.cursor.next_cursor from the previous response to retrieve the next page. A null next_cursor indicates the final page.
        Possible error codes:
        - INVALID_COLLECTION_SORT
        - INVALID_CURSOR
        - VALIDATION_ERROR
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - default: newest
        description: Collection order
        enum:
        - newest
        - oldest
        - name
        example: newest
        in: query
        name: sort
        type: string
      - default: 20
        description: Number of collections per page. Defaults to 20, capped at 50.
        example: 20
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor from meta.cursor.next_cursor of the previous page.
          Omit to start at the beginning.
        example: eyJ2IjoxLCJzIjoibmV3ZXN0In0
        in: query
        maxLength: 512
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page of collections, with meta.cursor.next_cursor null
            when there is no next page
          schema:
            $ref: '#/definitions/collection.ListCollectionsAPIResponse'
        "400":
          description: Invalid sort, limit or cursor
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: List collections
      tags:
      - Collection
  /collections/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        Delete one of the user's collections.
        saved_items_action determines what happens to the saved items in the collection. "delete" deletes the saved items, while "move" moves them to the collection specified by target_collection_id before deleting the collection.
        target_collection_id must be provided when saved_items_action is "move" and must be null when it is "delete". Unsorted can be used as a move destination.
        The Unsorted collection cannot be deleted.
        Possible error codes:
        - BAD_REQUEST
        - INVALID_COLLECTION_DELETE_ACTION
        - INVALID_COLLECTION_DELETE_TARGET
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - COLLECTION_NOT_FOUND
        - COLLECTION_DELETE_TARGET_NOT_FOUND
        - UNSORTED_COLLECTION_PROTECTED
        - COLLECTION_NOT_EMPTY
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Collection ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        in: path
        name: id
        required: true
        type: string
      - description: Delete collection request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/collection.DeleteCollectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/collection.DeleteCollectionAPIResponse'
        "400":
          description: Invalid collection ID, action or target
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Collection or target collection not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Unsorted collection, or collection is not empty
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a collection
      tags:
      - Collection
  /collections/{id}/saved-items:
    get:
      description: |-
        Retrieve a collection and its saved items, ordered by newest first.
        The response includes collection details even when the collection contains no saved items.
        Saved items are returned regardless of their enrichment status. A completed enrichment does not guarantee that all metadata fields are populated; nullable fields may still be null. Each item includes its optional note, which is null when the user has not set one.
        Pass meta.cursor.next_cursor from the previous response to retrieve the next page. A null next_cursor indicates the final page.
        Possible error codes:
        - BAD_REQUEST
        - INVALID_CURSOR
        - VALIDATION_ERROR
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - COLLECTION_NOT_FOUND
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Collection ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Number of saved items per page. Defaults to 20, capped at 50.
        example: 20
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor from meta.cursor.next_cursor of the previous page.
          Omit to start at the newest item.
        example: eyJ2IjoxLCJ2YWwiOiIyMDI2LTEwLTAyVDEwOjMwOjAwWiJ9
        in: query
        maxLength: 512
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: A page of the collection's saved items, with meta.cursor.next_cursor
            null when there is no next page
          schema:
            $ref: '#/definitions/collection.ListSavedItemsInCollectionAPIResponse'
        "400":
          description: Invalid limit, cursor or collection id
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Collection not found, or owned by another user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: List a collection's saved items
      tags:
      - Collection
  /internal/maintenance/client-releases:
    get:
      description: |-
        List a platform's releases newest first together with its current policy.
        Releases is always an array; latest and min_supported are null when the platform has no channel yet.
        Possible error codes:
        - INVALID_RELEASE_SECRET
        - INVALID_PLATFORM
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Release maintenance secret
        in: header
        name: X-Release-Secret
        required: true
        type: string
      - description: Client platform
        enum:
        - android
        - windows
        example: android
        in: query
        name: platform
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client_release.ListReleasesAPIResponse'
        "400":
          description: Invalid platform
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or missing release secret
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: List client releases
      tags:
      - Internal
    post:
      consumes:
      - application/json
      description: |-
        Record an immutable client release and make it the platform's latest.
        The release must have a build above the current latest. force also makes it the minimum supported build; it is false by default.
        Possible error codes:
        - INVALID_RELEASE_SECRET
        - INVALID_PLATFORM
        - INVALID_RELEASE_METADATA
        - CLIENT_RELEASE_ALREADY_EXISTS
        - INVALID_RELEASE_POLICY
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Release maintenance secret
        in: header
        name: X-Release-Secret
        required: true
        type: string
      - description: Release to publish
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client_release.PublishReleaseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/client_release.PublishReleaseAPIResponse'
        "400":
          description: Invalid platform or release metadata
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or missing release secret
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Release already exists or would violate the release policy
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Publish a client release
      tags:
      - Internal
  /internal/maintenance/client-releases/force:
    post:
      consumes:
      - application/json
      description: |-
        Set the platform's minimum supported build to an existing release.
        The target build must not be above the current latest release.
        Possible error codes:
        - INVALID_RELEASE_SECRET
        - INVALID_PLATFORM
        - INVALID_RELEASE_METADATA
        - RELEASE_NOT_FOUND
        - INVALID_RELEASE_POLICY
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Release maintenance secret
        in: header
        name: X-Release-Secret
        required: true
        type: string
      - description: Release to force
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client_release.ReleaseActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client_release.ReleasePolicyAPIResponse'
        "400":
          description: Invalid platform or build
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or missing release secret
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Release not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Release policy would be invalid
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Force a client release
      tags:
      - Internal
  /internal/maintenance/client-releases/rollback:
    post:
      consumes:
      - application/json
      description: |-
        Move the platform's latest pointer back to an existing release.
        The target must not be above the current latest. The minimum is lowered only when it would otherwise be above the new latest.
        Possible error codes:
        - INVALID_RELEASE_SECRET
        - INVALID_PLATFORM
        - INVALID_RELEASE_METADATA
        - RELEASE_NOT_FOUND
        - INVALID_RELEASE_POLICY
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Release maintenance secret
        in: header
        name: X-Release-Secret
        required: true
        type: string
      - description: Release to roll back to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client_release.ReleaseActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client_release.ReleasePolicyAPIResponse'
        "400":
          description: Invalid platform or build
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or missing release secret
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Release not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Release policy would be invalid
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Roll back a client release
      tags:
      - Internal
  /internal/maintenance/sessions/cleanup:
    post:
      description: |-
        Remove sessions that are revoked, past their absolute expiry, or beyond the allowed idle period, together with their associated refresh tokens.
        Intended to be invoked periodically by an external scheduler.
        Possible error codes:
        - CLEANUP_SECRET_INVALID
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Cleanup secret
        in: header
        name: X-Cleanup-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.CleanupSessionsAPIResponse'
        "401":
          description: Invalid or missing cleanup secret
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      summary: Run session cleanup
      tags:
      - Internal
  /saved-items:
    get:
      description: |-
        Retrieve the authenticated user's saved items across all collections, ordered by newest first.
        Saved items are returned regardless of their collection or enrichment status. Each item includes its associated collection and its optional note, which is null when the user has not set one.
        enrichment_status indicates the enrichment state of an item: pending, completed, or failed. A completed status does not guarantee that all metadata fields are populated.
        Pass meta.cursor.next_cursor from the previous response to retrieve the next page. A null next_cursor indicates the final page.
        Possible error codes:
        - BAD_REQUEST (unparsable limit or cursor length)
        - INVALID_CURSOR
        - VALIDATION_ERROR (limit outside 1..50)
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - default: 20
        description: Number of saved items per page. Defaults to 20, capped at 50.
        example: 20
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor from meta.cursor.next_cursor of the previous page.
          Omit to start at the newest item.
        example: eyJ2IjoxLCJ2YWwiOiIyMDI2LTEwLTAyVDEwOjMwOjAwWiJ9
        in: query
        maxLength: 512
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: A page of recent saved items, with meta.cursor.next_cursor
            null when there is no next page
          schema:
            $ref: '#/definitions/saved_item.ListSavedItemsAPIResponse'
        "400":
          description: Invalid limit or cursor
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: List recent saved items
      tags:
      - SavedItem
    post:
      consumes:
      - application/json
      description: |-
        Save a URL to the authenticated user's inbox.
        The saved item is returned with an initial enrichment_status of "pending". Metadata enrichment is handled asynchronously.
        An optional plain-text note may be submitted with the URL. It is nullable, may span multiple lines, is limited to 5000 characters, and a whitespace-only value is stored as null.
        Possible error codes:
        - VALIDATION_ERROR
        - INVALID_URL
        - INVALID_NOTE
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Save URL request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/saved_item.CreateSavedItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The saved item's id, url, stored note, collection_id and enrichment_status
          schema:
            $ref: '#/definitions/saved_item.CreateSavedItemAPIResponse'
        "400":
          description: Validation error or invalid URL
          schema:
            $ref: '#/definitions/swagger.ValidationErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Rate limit exceeded for this user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Rate limiting is unavailable, so the save is refused
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Save a URL
      tags:
      - SavedItem
  /saved-items/{id}:
    delete:
      description: |-
        Delete a saved item by ID.
        Deleting a saved item does not delete its collection. The response indicates whether the collection is now empty and whether it can be deleted.
        The collection deletion eligibility is advisory and may change if the collection is modified by another request.
        Possible error codes:
        - BAD_REQUEST
        - RESOURCE_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Saved item ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/saved_item.DeleteSavedItemAPIResponse'
        "400":
          description: Invalid saved item ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Saved item not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a saved item
      tags:
      - SavedItem
    get:
      description: |-
        Retrieve a saved item by ID, including the collection it belongs to and its optional note.
        The saved item is returned regardless of its enrichment status. A completed enrichment does not guarantee that all metadata fields are populated. note is null when the user has not set one.
        Possible error codes:
        - BAD_REQUEST (non-UUID id)
        - RESOURCE_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Saved item ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The complete saved item and the id and name of the collection
            it is in
          schema:
            $ref: '#/definitions/saved_item.GetSavedItemAPIResponse'
        "400":
          description: Invalid saved item ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Saved item not found, or owned by another user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a saved item
      tags:
      - SavedItem
  /saved-items/{id}/collection:
    put:
      consumes:
      - application/json
      description: |-
        Add a saved item to one of the user's collections.
        Any collection owned by the user can be used as a destination, including system and automatically created collections.
        collection_intent determines how the collection is selected. "existing" selects a collection by name or creates one if it does not exist. "create" creates a new collection and returns a conflict if the name is already in use.
        Possible error codes:
        - INVALID_COLLECTION_NAME
        - INVALID_COLLECTION_INTENT
        - BAD_REQUEST
        - SAVED_ITEM_NOT_FOUND
        - COLLECTION_NAME_ALREADY_EXISTS
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Saved item ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        in: path
        name: id
        required: true
        type: string
      - description: Put saved item into collection request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/collection.PutSavedItemIntoCollectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/collection.PutSavedItemIntoCollectionAPIResponse'
        "400":
          description: Invalid collection name or intent, or saved item ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Saved item not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: Collection name already exists
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Put a saved item into a collection
      tags:
      - Collection
  /saved-items/{id}/enrich:
    post:
      description: |-
        Fetch metadata from the saved item's URL.
        Enrichment may return partial metadata when some fields are unavailable. A failed enrichment does not invalidate or remove the saved item.
        The enrichment result is reported through enrichment_status in the response.
        Enrichment does not change the saved item's collection.
        Possible error codes:
        - SAVED_ITEM_NOT_FOUND
        - BAD_REQUEST
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Saved item ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enrichment.EnrichSavedItemAPIResponse'
        "400":
          description: Invalid saved item ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Saved item not found
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Rate limit exceeded for this user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Rate limiting is unavailable, so the fetch is not attempted
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Enrich one saved item's metadata
      tags:
      - SavedItem
  /saved-items/{id}/note:
    delete:
      description: |-
        Clear the note on a saved item by setting it to null. The saved item itself is not deleted.
        A missing saved item, an item owned by another user, and an item with no note all follow the existing not-found or success behavior: the item is scoped by both id and user, and clearing an absent note succeeds.
        Possible error codes:
        - BAD_REQUEST (non-UUID id)
        - RESOURCE_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Saved item ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/saved_item.DeleteSavedItemNoteAPIResponse'
        "400":
          description: Invalid saved item ID
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Saved item not found, or owned by another user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Note mutation rate limit exceeded for this user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Rate limiting is unavailable, so the note is not cleared
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a saved item's note
      tags:
      - SavedItem
    put:
      consumes:
      - application/json
      description: |-
        Add a plain-text note to a saved item, or replace the note it already has. Adding and editing use the same endpoint.
        The note is required and may be at most 5000 characters. It is plain text and may span multiple lines. A whitespace-only value is rejected; use DELETE /saved-items/{id}/note to remove a note.
        The response reports the note as it was stored. A missing saved item and one owned by another user produce the same not found error.
        Possible error codes:
        - INVALID_NOTE
        - BAD_REQUEST (non-UUID id or malformed body)
        - RESOURCE_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Saved item ID
        example: 01a0f359-093b-737a-963a-80f7ca6768ed
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Add or edit note request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/saved_item.UpdateSavedItemNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The note as it was stored
          schema:
            $ref: '#/definitions/saved_item.UpdateSavedItemNoteAPIResponse'
        "400":
          description: Invalid note, saved item ID, or body
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: Saved item not found, or owned by another user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Note mutation rate limit exceeded for this user
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: Rate limiting is unavailable, so the note is not written
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Add or edit a saved item's note
      tags:
      - SavedItem
  /search:
    get:
      description: |-
        Search the authenticated user's saved items and collections.
        Saved items are matched by title, domain, and URL. Collections are matched by name, including system collections.
        Search supports partial matches and typo tolerance. Results are ranked by relevance, with recency used to break ties.
        Results are limited and are not paginated.
        Saved item results carry the item's collection, its enrichment_status and its optional note, so a client can tell where it lives, whether it has been read, and what the user wrote about it; each result is a subset of the item shape reported by GET /collections/{id}/saved-items. The note is reported but is not searchable.
        Possible error codes:
        - INVALID_SEARCH_QUERY
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Search query, at least 2 and at most 128 characters
        example: camera
        in: query
        maxLength: 128
        minLength: 2
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/search.SearchAPIResponse'
        "400":
          description: Search query is blank, shorter than 2 characters or longer
            than 128 characters
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Search saved items and collections
      tags:
      - Search
  /users/me:
    get:
      description: |-
        Retrieve the authenticated user's profile, including linked authentication providers and whether the account has a password credential.
        identities contains the authentication providers linked to the account. The array is always present and may be empty. Clients should support provider values they do not recognize.
        email_snapshot and display_name_snapshot represent provider information captured when the identity was linked. They are historical values and are not refreshed, so they may differ from the user's current email and display name; nothing is fetched from the provider to reconcile them. Both fields may be null.
        has_password_credential indicates whether the account has a password credential and can be used to determine which password settings options to display. The password update endpoint remains authoritative when applying changes.
        Possible error codes:
        - USER_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.GetUserAPIResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: The account this token names no longer exists
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's profile
      tags:
      - User
    patch:
      consumes:
      - application/json
      description: |-
        Update the authenticated user's display name. display_name is the only field accepted by this endpoint.
        The display name must contain between 2 and 100 characters. Leading and trailing whitespace are preserved.
        The response contains the updated user profile, including linked authentication providers.
        Possible error codes:
        - VALIDATION_ERROR
        - BAD_REQUEST
        - USER_NOT_FOUND
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UpdateUserAPIResponse'
        "400":
          description: Malformed body, or display_name absent, shorter than 2 or longer
            than 100 characters
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "404":
          description: The account this token names no longer exists
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Update the current user's display name
      tags:
      - User
  /users/me/password:
    put:
      consumes:
      - application/json
      description: |-
        Create a password for an account that does not have a password credential, or change the existing password.
        Send new_password alone when creating a password. When changing an existing password, both new_password and current_password are required.
        The operation is determined by the account's current password credential state. has_password_credential from GET /users/me is a UI hint; this endpoint remains authoritative.
        Access tokens are stateless: revoking a session does not invalidate an access token that was already issued from it. Creating a password does not revoke existing sessions. Changing an existing password revokes all other active sessions while preserving the current session, but access tokens associated with revoked sessions may remain usable until they expire, which is at most 15 minutes.
        The response message distinguishes between "password created successfully" and "password changed successfully".
        Possible error codes:
        - VALIDATION_ERROR
        - BAD_REQUEST
        - CURRENT_PASSWORD_REQUIRED
        - UNEXPECTED_CURRENT_PASSWORD
        - INVALID_AUTHORIZATION_HEADER
        - INVALID_ACCESS_TOKEN
        - ACCESS_TOKEN_EXPIRED
        - CURRENT_PASSWORD_INVALID
        - PASSWORD_CREDENTIAL_NOT_FOUND
        - PASSWORD_CREDENTIAL_ALREADY_EXISTS
        - PASSWORD_ALREADY_CHANGED
        - USER_RATE_LIMIT_EXCEEDED
        - USER_RATE_LIMIT_UNAVAILABLE
        - PASSWORD_WORK_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
      parameters:
      - description: Password to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SetPasswordAPIResponse'
        "400":
          description: Malformed body, new_password absent, shorter than 8 or longer
            than 128 characters, or current_password sent for an account with no password
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "401":
          description: Invalid or expired access token, or the submitted current_password
            does not match
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "409":
          description: A concurrent request created or changed this password first
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "429":
          description: Too many password requests from this account
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
        "503":
          description: No password capacity is available, or the request could not
            be rate limited; nothing was written
          schema:
            $ref: '#/definitions/swagger.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or change the current user's password
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: 'Enter your access token using the Bearer scheme. Example: "Bearer
      {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
