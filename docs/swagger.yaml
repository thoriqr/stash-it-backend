      tags:
      - Registration
  /auth/register/recovery/manual:
    post:
      consumes:
      - application/json
      description: |-
        Start a recovery verification for a manual registration whose normal registration verification has
        completed (`verified`) and whose continuation is no longer usable.
        The existing registration is not expired or replaced until the recovery PIN is verified.
        The response reports `verification_status: pending`; request a PIN and verify it through the existing registration verification routes.
        Possible error codes:
        - VALIDATION_ERROR
        - REGISTRATION_ALREADY_PENDING: the registration's normal verification has not reached `verified`; continue the normal registration flow instead, which returns the existing verification id
        - REGISTRATION_NOT_PENDING
        - REGISTRATION_ALREADY_COMPLETED
        - REGISTRATION_EXPIRED
        - INVALID_REGISTRATION_TYPE
        - IP_RATE_LIMIT_EXCEEDED
        - IP_RATE_LIMIT_UNAVAILABLE
