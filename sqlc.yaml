version: "2"

sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/auth/registration/queries.sql"
    gen:
      go:
        package: "registrationdb"
        out: "internal/api/auth/registration/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/user/queries.sql"
    gen:
      go:
        package: "userdb"
        out: "internal/api/user/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
