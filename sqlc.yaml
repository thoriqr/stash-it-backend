version: "2"

sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/auth/queries.sql"
    gen:
      go:
        package: "authdb"
        out: "internal/auth/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
