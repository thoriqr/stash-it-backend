version: "2"

sql:
  # Production queries
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/auth/registration/queries.sql"
    gen:
      go:
        package: "registrationdb"
        out: "internal/api/auth/registration/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/auth/login/queries.sql"
    gen:
      go:
        package: "logindb"
        out: "internal/api/auth/login/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/auth/session/queries.sql"
    gen:
      go:
        package: "sessiondb"
        out: "internal/api/auth/session/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/auth/password_reset/queries.sql"
    gen:
      go:
        package: "passwordresetdb"
        out: "internal/api/auth/password_reset/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/user/queries.sql"
    gen:
      go:
        package: "userdb"
        out: "internal/api/user/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

  # Integration test queries for registration
  - engine: "postgresql"
    schema: "internal/database/baseline/schema.sql"
    queries: "internal/testutil/db/registration/queries.sql"
    gen:
      go:
        package: "registrationtestdb"
        out: "internal/testutil/db/registration/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
