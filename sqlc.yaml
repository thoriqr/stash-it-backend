version: "2"

sql:
  # Production queries
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/api/auth/registration/queries.sql"
    gen:
      go:
        omit_unused_structs: true
        package: "registrationdb"
        out: "internal/api/auth/registration/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
